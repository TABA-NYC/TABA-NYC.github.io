.art-head{padding:calc(var(--space-64) + var(--space-24)) 0 var(--space-8)}
.art-head .kicker{font-size:var(--font-size-11);line-height:var(--line-height-11);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:var(--space-16)}
.art-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(var(--font-size-40),6vw,var(--font-size-60));letter-spacing:-.025em;line-height:1.13}
.art-head .lede{margin-top:var(--space-16);font-size:var(--font-size-18);line-height:var(--line-height-18);color:var(--muted);max-width:580px}
.gallery{columns:3;column-gap:var(--space-16);padding:var(--space-40) 0 var(--space-16)}
@media(max-width:900px){.gallery{columns:2}}
@media(max-width:560px){.gallery{columns:1}}
.art-item{display:block;break-inside:avoid;margin:0 0 var(--space-16);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line);background:var(--bg-surface-default);cursor:zoom-in;transition:.2s ease-out}
.art-item:hover{transform:translateY(calc(-1*var(--space-2)));box-shadow:0 4px 8px color-mix(in srgb,var(--color-neutral-900) 8%,transparent),0 8px 20px color-mix(in srgb,var(--color-neutral-900) 12%,transparent)}
.art-item img{display:block;width:100%;height:auto}
.lb{position:fixed;inset:0;background:color-mix(in srgb,var(--color-neutral-950) 93%,transparent);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--space-32);cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:95vw;max-height:92vh;border-radius:var(--radius-sm);box-shadow:0 8px 16px color-mix(in srgb,var(--color-neutral-900) 10%,transparent),0 16px 32px color-mix(in srgb,var(--color-neutral-900) 14%,transparent)}
.lb button{position:absolute;color:var(--color-neutral-50);background:none;border:none;cursor:pointer;opacity:.8}
.lb button:hover{opacity:1}
.lb .close{top:var(--space-16);right:var(--space-24);font-size:var(--font-size-32);line-height:1}
.lb .nav{top:50%;transform:translateY(-50%);font-size:var(--font-size-40);padding:var(--space-12)}
.lb .prev{left:var(--space-12)}
.lb .next{right:var(--space-12)}

<script>
(function(){
  var items=[].slice.call(document.querySelectorAll('.art-item'));
  var lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), i=-1;
  function show(n){ if(n<0)n=items.length-1; if(n>=items.length)n=0; i=n; lbimg.src=items[i].dataset.full; lb.classList.add('open'); }
  function close(){ lb.classList.remove('open'); lbimg.src=''; }
  items.forEach(function(a,n){ a.addEventListener('click',function(e){ e.preventDefault(); show(n); }); });
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target===lbimg) close(); });
  document.getElementById('lbclose').addEventListener('click',close);
  document.getElementById('lbprev').addEventListener('click',function(e){ e.stopPropagation(); show(i-1); });
  document.getElementById('lbnext').addEventListener('click',function(e){ e.stopPropagation(); show(i+1); });
  document.addEventListener('keydown',function(e){ if(!lb.classList.contains('open'))return; if(e.key==='Escape')close(); if(e.key==='ArrowLeft')show(i-1); if(e.key==='ArrowRight')show(i+1); });
})();
</script>
